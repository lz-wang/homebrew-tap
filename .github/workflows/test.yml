name: Test Formulae

on:
  pull_request:
    paths:
      - "Formula/**/*.rb"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "Formula/**/*.rb"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  m2h:
    name: Verify m2h Formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tap local repository
        shell: bash
        run: brew tap lz-wang/tap "file://${GITHUB_WORKSPACE}"

      - name: Audit, install, and test Formula
        shell: bash
        run: |
          set -euo pipefail
          brew audit --strict --formula lz-wang/tap/m2h
          brew install --formula lz-wang/tap/m2h
          brew test lz-wang/tap/m2h
